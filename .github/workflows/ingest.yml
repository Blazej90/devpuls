name: Ingest news

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # bez `version:` - action-setup v4 czyta pole `packageManager` z root package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # Migracje sa idempotentne - juz zastosowane sa pomijane po wpisie
      # w schema_migrations. Dzieki temu nowa migracja w repo trafia do bazy
      # przy najblizszym przebiegu, bez recznego kroku.
      - name: Migracje bazy
        run: pnpm agent:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Pobranie i ocena zrodel
        run: pnpm agent:ingest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
