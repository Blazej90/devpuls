packages:
  - "apps/*"
  - "packages/*"

# Skrypty postinstall wymagają jawnej zgody (pnpm 11).
allowBuilds:
  # Nie potrzebuje builda — binarki dla platformy przychodzą jako optionalDependencies.
  unrs-resolver: false
  # Potrzebuje — postinstall podpina binarkę esbuilda używaną przez tsx.
  esbuild: true

minimumReleaseAgeExclude:
  - '@anthropic-ai/sdk@0.120.0'
